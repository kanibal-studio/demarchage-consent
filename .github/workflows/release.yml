name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  ci:
    # Rien n'est publié si les tests, le lint, le typage ou le build échouent.
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    # Environnement GitHub « pypi » : approbation du mainteneur requise avant toute
    # publication, tags v* uniquement. L'éditeur de confiance PyPI est lié à ce même
    # environnement : un job qui ne le déclare pas ne peut pas publier.
    environment:
      name: pypi
      url: https://pypi.org/project/demarchage-consent/
    permissions:
      id-token: write  # Trusted Publishing (OIDC) — requis, aucun token stocké
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Le tag doit correspondre à la version du paquet
        run: |
          version="$(python -c 'import demarchage_consent; print(demarchage_consent.__version__)')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} ≠ version du paquet ${version} (demarchage_consent/__init__.py)"
            exit 1
          fi
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
